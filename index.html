<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Para alguém especial 💖</title>
    <style>
        body {
            text-align: center;
            font-family: 'Segoe Script', cursive;
            background: linear-gradient(to bottom, #ffe6f0, #ffccd9);
            padding-top: 60px;
            color: #cc0066;
        }
        h1 {
            font-size: 2.5em;
        }
        img {
            margin-top: 30px;
            width: 220px;
            height: 220px;
            border: 5px solid #ffb3c6;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff99cc;
        }
        .heart {
            font-size: 40px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Para Você 💕</h1>
    <div class="heart">❤️</div>
    <p>Escaneie o QR Code abaixo ou <a href="https://seunome.github.io/repositorio/surpresa.html" target="_blank">clique aqui</a></p>
    <!-- Substitua o link abaixo pelo link completo da sua página hospedada -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?data=https://seunome.github.io/repositorio/surpresa.html&size=220x220" alt="QR Code para Surpresa">
</body>
</html>
